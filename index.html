    <script>
      (function() {
        try {
          var saved = localStorage.getItem('devtech_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
        } catch(e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
